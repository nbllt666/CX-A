[pytest]
# 后端/安装器测试入口固定为 tests/。
#
# 为什么需要这个文件：本机曾把 MeloTTS 源码放在仓库根（.gitignore 已忽略 MeloTTS/），
# 不带参数的 `python -m pytest` 会把 MeloTTS/test/ 一并收集进来——那两个文件依赖未安装的
# `melo` 包，直接导致 collection 中断（Interrupted: 2 errors），看起来像"项目测试挂了"。
# 固定 testpaths 后，`python -m pytest` 与 `python -m pytest tests/` 等价。
testpaths = tests